name: Auto-merge game result PRs after delay

on:
  schedule:
    - cron: "*/45 * * * *"
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write

    env:
      DELAY_HOURS: "13"

    steps:
      - name: Auto-merge
        uses: actions/github-script@v8
        with:
          script: |
            const delayHours = parseFloat(process.env.DELAY_HOURS || "24");
            const now = new Date();
            let mergedCount = 0;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              sort: "created",
              direction: "asc",
              per_page: 100,
            });

            for (const pr of prs) {
              // Only PRs with the auto-merge-delayed label
              const hasLabel = pr.labels.some(
                (l) => l.name === "auto-merge-delayed"
              );
              if (!hasLabel) continue;

              // Only game branches
              if (!pr.head.ref.startsWith("game-")) continue;

              // Parse game number from branch name: game-<number>_...
              const match = pr.head.ref.match(/^game-(\d+)_/);
              if (!match) {
                core.info(`PR #${pr.number}: could not parse game number from branch '${pr.head.ref}', skipping.`);
                continue;
              }
              const gameNumber = match[1];

              const createdAt = new Date(pr.created_at);
              const ageHours = (now - createdAt) / 36e5; // ms → hours

              if (ageHours < delayHours) {
                core.info(
                  `PR #${pr.number} not old enough yet (${ageHours.toFixed(
                    2
                  )}h < ${delayHours}h)`
                );
                continue;
              }

              core.info(`Merging PR #${pr.number} for game #${gameNumber}...`);

              // Merge PR with merge commit
              const mergeResult = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: "merge",
              });

              core.info(`PR #${pr.number} merged as commit ${mergeResult.data.sha}.`);
              mergedCount++;
            }

            // Merges made with GITHUB_TOKEN don't fire pull_request events, so
            // ask the release workflow to run. If this call fails, its hourly
            // run creates the release instead.
            if (mergedCount > 0) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "release.yaml",
                  ref: "master",
                });
                core.info("Requested the release workflow.");
              } catch (error) {
                core.warning(`Could not request the release workflow: ${error.message}`);
              }
            }
